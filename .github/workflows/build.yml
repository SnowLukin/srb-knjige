name: Release

# Каждый пуш в main: тесты → сборка → новый релиз с Knjige.dmg во вкладке Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: swift test

      - name: Build DMG
        run: ./scripts/make_dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.1.${{ github.run_number }}
        run: |
          gh release create "$VERSION" build/Knjige.dmg \
            --target "$GITHUB_SHA" \
            --title "Knjige $VERSION" \
            --latest \
            --notes "$(git log -1 --pretty=%s)

          Установка: открой Knjige.dmg и перетащи Knjige в «Программы». При первом запуске — правый клик → «Открыть»."
