name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: swift test

      - name: Build DMG
        run: ./scripts/make_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Knjige-dmg
          path: build/Knjige.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Knjige.dmg --title "Knjige $GITHUB_REF_NAME" --notes "Скачай Knjige.dmg, открой и перетащи Knjige в «Программы»."
