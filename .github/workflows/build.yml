name: Release

# Релиз выпускается только вручную:
#  • Actions → Release → Run workflow → ввести версию (например 0.2), или
#  • запушить тег: git tag v0.2 && git push origin v0.2
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например 0.2)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Tests
        run: swift test

      - name: Build DMG
        run: ./scripts/make_dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Knjige.dmg \
            --target "$GITHUB_SHA" \
            --title "Knjige $VERSION" \
            --generate-notes \
            --latest
